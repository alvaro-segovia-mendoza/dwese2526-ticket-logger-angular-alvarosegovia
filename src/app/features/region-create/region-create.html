<section class="create-container">
 <div class="top-row">
   <h2>Nueva Comunidad Autónoma</h2>
   <a routerLink="/regions" class="back-link">← Volver</a>
 </div>


 @if (error) {
   <p class="error-message" role="alert">{{ error }}</p>
 }


 <form #f="ngForm" (ngSubmit)="onSubmit(f)" class="create-form" novalidate>
   <div class="form-group">
     <label for="code">Código (2 caracteres)</label>
     <input
       id="code"
       name="code"
       type="text"
       maxlength="2"
       required
       [(ngModel)]="model.code"
       placeholder="Ej: 01"
     />
     @if (fieldErrors['code']) {
       <small class="field-error">{{ fieldErrors['code'] }}</small>
     }
   </div>


   <div class="form-group">
     <label for="name">Nombre</label>
     <input
       id="name"
       name="name"
       type="text"
       maxlength="100"
       required
       [(ngModel)]="model.name"
       placeholder="Ej: ANDALUCÍA"
     />
     @if (fieldErrors['name']) {
       <small class="field-error">{{ fieldErrors['name'] }}</small>
     }
   </div>


   <button type="submit" class="primary-btn" [disabled]="f.invalid || loading">
     @if (loading) { Creando... } @else { Crear }
   </button>
 </form>
</section>
