<section class="edit-container">
 <div class="top-row">
   <h2>Editar Comunidad Autónoma</h2>
   <a routerLink="/regions" class="back-link">← Volver</a>
 </div>


 @if (loading) {
   <p class="info">Cargando datos de la región...</p>
 }


 @if (!loading) {
   @if (error) {
     <p class="error-message" role="alert">{{ error }}</p>
   }


   <form #f="ngForm" (ngSubmit)="onSubmit(f)" class="edit-form" novalidate>
     <div class="form-group">
       <label>ID</label>
       <input type="text" [value]="model.id" disabled />
     </div>


     <div class="form-group">
       <label for="code">Código</label>
       <input
         id="code"
         name="code"
         type="text"
         maxlength="2"
         required
         [(ngModel)]="model.code"
       />
       @if (fieldErrors['code']) {
         <small class="field-error">{{ fieldErrors['code'] }}</small>
       }
     </div>


     <div class="form-group">
       <label for="name">Nombre</label>
       <input
         id="name"
         name="name"
         type="text"
         maxlength="100"
         required
         [(ngModel)]="model.name"
       />
       @if (fieldErrors['name']) {
         <small class="field-error">{{ fieldErrors['name'] }}</small>
       }
     </div>


     <button type="submit" class="primary-btn" [disabled]="f.invalid || saving">
       @if (saving) { Guardando... } @else { Guardar cambios }
     </button>
   </form>
 }
</section>
