<header class="main-header">

  <a href="/">Álvaro Segovia Mendoza</a>
</div>
<nav class="navigation">
  <ul class="nav-links">
    <li><a routerLink="/">Inicio</a></li>

    @if (isLoggedIn$ | async) {

      <li><a href="#" (click)="logout(); $event.preventDefault()">Logout</a></li>
    } @else {

    }
  </ul>

</nav>
</header>
